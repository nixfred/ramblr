<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr health</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.hh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hh .title{font-size:24px;font-weight:800;letter-spacing:.08em;color:#eaffff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.big{font-size:26px;font-weight:800;color:#eaffff;line-height:1.1}.sub{color:var(--dim);font-size:12px;margin-top:4px;word-break:break-all}
.ok{color:var(--mint)}.warn{color:var(--amber)}.bad{color:var(--bad)}.mut{color:var(--mag)}
.meter{height:10px;border-radius:5px;background:#0a101b;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mag));box-shadow:0 0 10px var(--teal);transition:width .4s}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:8px}.spark i{flex:1;background:var(--teal);opacity:.8;border-radius:2px 2px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #111b2c}th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:10px}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
@media(max-width:520px){.big{font-size:21px}td:nth-child(4),th:nth-child(4){display:none}}
</style>
</head>
<body data-page="health">
<main class="page">
  <div class="hh"><span class="title glitch">HEALTH</span><span class="dim" id="upd"></span></div>
  <div class="tiles">
    <section class="card"><h2>Mic</h2><div class="big" id="mic">…</div><div class="sub" id="micsub"></div><div class="meter" title="level of the last classified window"><i id="lvl" style="width:0"></i></div></section>
    <section class="card"><h2>NPU</h2><div class="big" id="npu">…</div><div class="sub" id="npusub"></div><div class="meter"><i id="npubar" style="width:0"></i></div></section>
    <section class="card"><h2>Database</h2><div class="big" id="db">…</div><div class="sub" id="dbsub"></div><div class="spark" id="grow" title="lines per day, last 14 days"></div></section>
    <section class="card"><h2>Disk</h2><div class="big" id="disk">…</div><div class="sub" id="disksub"></div><div class="meter"><i id="diskbar" style="width:0"></i></div></section>
  </div>
  <div class="row2">
    <section class="card"><h2>Services</h2><table><thead><tr><th>Unit</th><th>State</th><th>Memory</th><th>Since</th><th>Restarts</th></tr></thead><tbody id="svc"></tbody></table></section>
    <section class="card"><h2>Nightly and backup</h2><div id="night" class="sub" style="font-size:13px"></div><h2 style="margin-top:12px">Rows</h2><div id="rows" class="sub" style="font-size:12px"></div></section>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,el,api}=R;
const mb=b=>b>=2**30?(b/2**30).toFixed(1)+' GB':b>=2**20?(b/2**20).toFixed(1)+' MB':Math.round(b/1024)+' KB';
const ago=ts=>{if(!ts)return 'never';const s=Date.now()/1000-ts;return s<90?Math.round(s)+' s ago':s<5400?Math.round(s/60)+' min ago':s<172800?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
async function load(){
  let h;try{h=await api('/api/health')}catch(e){$('#upd').textContent='unreachable';return}
  const m=h.mic;const st=m.muted?'MUTED':(m.state||'down').toUpperCase();
  $('#mic').textContent=st;$('#mic').className='big '+(m.muted?'mut':m.state==='listening'&&!m.warning?'ok':'warn');
  $('#micsub').textContent=`${(m.source||'').replace('alsa_input.','').slice(0,48)} · heartbeat ${m.heartbeat_age??'?'}s · last line ${ago(m.last_line)} · ${m.asr} · media classifier ${m.media_classifier||'off'}${m.warning?' · ⚠ '+m.warning:''}`;
  const db20=m.level_rms?Math.max(0,Math.min(100,(20*Math.log10(m.level_rms)+70)/60*100)):0;$('#lvl').style.width=db20+'%';
  const n=h.npu;$('#npu').textContent=n.present?(n.busy_pct==null?'…':n.busy_pct.toFixed(1)+'% busy'):'not found';
  $('#npusub').textContent=n.present?`${n.memory_bytes?mb(n.memory_bytes)+' in use':''} · ${n.freq_mhz} / ${n.max_mhz} MHz · ${n.busy_total_s}s busy since boot · Whisper + YAMNet + search embedder share it`:'';
  $('#npubar').style.width=Math.min(100,n.busy_pct||0)+'%';
  const s=h.storage;$('#db').textContent=mb(s.db_total);
  $('#dbsub').textContent=`${s.week_bytes==null?'growth: '+s.growth_basis:'+'+mb(Math.max(0,s.week_bytes))+' per week ('+s.growth_basis+')'} · ${s.counts.segments} lines · tmpfs spool ${mb(s.spool_bytes)}`;
  const g=$('#grow');g.textContent='';const mx=Math.max(1,...s.growth.map(x=>x.lines));s.growth.forEach(x=>{const i=el('i');i.style.height=Math.max(3,100*x.lines/mx)+'%';i.title=`${x.day}: ${x.lines} lines`;g.append(i)});
  $('#disk').textContent=mb(s.disk_free)+' free';$('#disksub').textContent=`of ${mb(s.disk_total)} · ${s.years_of_disk_at_this_rate?s.years_of_disk_at_this_rate+' years left at this week\'s rate':'growth too small to measure yet'}`;
  $('#diskbar').style.width=(100*(1-s.disk_free/s.disk_total))+'%';
  const tb=$('#svc');tb.textContent='';h.services.forEach(x=>{const tr=el('tr');const ok=x.active==='active';
    const stt=el('td',ok?'ok':'bad',x.sub||x.active);tr.append(el('td',null,x.unit.replace('ramblr-','')),stt,el('td',null,x.rss_mb?x.rss_mb+' MB':(x.next?'next '+x.next.split(' ').slice(1,3).join(' '):'')),
      el('td','dim',(x.since||'').split(' ').slice(1,3).join(' ')),el('td',x.restarts?'warn':'dim',String(x.restarts??'')));tb.append(tr)});
  const nb=h.nightly,bk=h.backup;$('#night').textContent=`Last nightly: ${nb.started||'never'} ${nb.ok===null?'':nb.ok?'✓ ok':'✗ errors'} · Last backup: ${bk?bk.at+' → '+bk.host+' · '+mb(bk.bytes)+(bk.verified?' · checksum ✓':' · NOT verified'):'none yet'}`;
  $('#rows').textContent=Object.entries(s.counts).map(([k,v])=>`${k} ${v}`).join(' · ');
  $('#upd').textContent='updated '+new Date().toLocaleTimeString();
}
load();setInterval(load,5000);
</script>
<script src="/static/palette.js"></script>
</body>
</html>
