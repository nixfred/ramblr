<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.dayhead .title{font-size:22px;font-weight:800;letter-spacing:.04em;margin-right:6px;color:#eaffff}
.dayhead select{max-width:230px}
.dayhead input[type=search]{min-width:200px;flex:1;max-width:340px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label.chk{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center;letter-spacing:.06em}
#info{font-size:11px;color:var(--dim);letter-spacing:.06em}
.heat{padding:10px 12px 8px}
#heatcv{width:100%;height:92px;display:block;cursor:crosshair;touch-action:none;border-radius:8px;background:linear-gradient(#060a12,#04060b)}
#pres{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.plane{position:relative;font-size:10px}
.plane .pn{position:absolute;left:4px;top:0;z-index:2;line-height:14px;font-weight:700;padding:0 4px;border-radius:4px;background:#05070dcc;pointer-events:none;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plane .pt{position:relative;height:14px;border-radius:5px;background:#0a101b;overflow:hidden}
.plane .pt i{position:absolute;top:2px;bottom:2px;border-radius:5px;opacity:.85;box-shadow:0 0 8px currentColor}
.plane .pt b{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#ffffff0d 0 4px,transparent 4px 8px)}
.line .moon{color:#9aa8ff;margin-left:4px}
.line .pl{border:0;background:none;box-shadow:none;min-height:0;padding:0 0 0 6px;color:var(--teal);cursor:pointer;font-size:12px}
.line .pl:hover{color:#fff;text-shadow:var(--glow)}
#heatinfo{font-size:11px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:12px 0}
@media(min-width:1100px){.grid2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}}
#otd{display:flex;flex-direction:column;gap:8px}
.otd{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:10px 12px;width:100%;background:var(--panel2)}
.otd.none{opacity:.5}.otd .ol{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mag)}.otd .od{font-size:12px;color:var(--dim)}
.otd .ot{font-family:var(--sans);font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#convs{margin:0 0 12px}#convlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);cursor:pointer;font-family:var(--sans);font-size:14px}
.cv:hover{border-color:var(--teal);box-shadow:var(--glow)}.cv b{display:block;color:#fff;font-size:15px}.cv .m{color:var(--dim);font:11px var(--mono);margin:2px 0 6px}
.cv ul{margin:4px 0 0;padding-left:18px;color:#bfe}
#daysum .box{background:transparent;border:0;padding:0}
#daysum details>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);font-weight:800;margin-bottom:6px}
#daysum .hl{font-family:var(--sans);font-size:17px;color:#fff;line-height:1.4}
#daysum h4{margin:12px 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mag)}
#daysum ul{margin:2px 0;padding-left:18px;font-family:var(--sans);font-size:14px}
#daysum .ai{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;font-family:var(--sans);font-size:14px}
#daysum .ai:hover{background:#0d1a2a}#daysum .ai small{color:var(--dim);font-family:var(--mono)}
#daysum>small,#daysum .box>small{color:var(--dim);font-size:11px}
.nosum{color:var(--dim);font-size:13px}
#rangebar{position:sticky;top:var(--shellh,96px);z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin:0 0 8px;
  background:#070b14ee;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(4px)}
#rangebar .lbl{color:var(--dim);font-size:12px}
#rangebar input[type=datetime-local]{max-width:215px}
#selcount{color:var(--mag);font-size:12px;font-weight:700;letter-spacing:.06em}
#speakers{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chipb{display:inline-flex;gap:8px;align-items:center;padding:4px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;min-height:36px}
.chipb:hover{border-color:var(--teal);box-shadow:var(--glow)}
.chipb i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.chipb small{color:var(--dim)}
#lines{font-family:var(--sans)}
.line{display:grid;grid-template-columns:76px 150px 1fr 30px 30px;gap:10px;padding:6px 8px;border-radius:8px;user-select:none;align-items:baseline;transition:background .12s}
.line:hover{background:#0b1626}
.line.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--mag)}
.line .t{color:var(--dim);font:12px var(--mono);cursor:pointer}
.line .who{border:0;background:none;padding:0;min-height:0;text-align:left;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:none;font-family:var(--mono);font-size:13px}
.line .who:hover{text-decoration:underline;box-shadow:none}
.line .who.anon{font-style:italic;font-weight:500}
.line .x{cursor:pointer;color:var(--dim);border:0;background:none;padding:0;min-height:0;opacity:0;box-shadow:none}
.line:hover .x{opacity:1}
.line.noise .tx{color:var(--dim);font-style:italic}
.line.pending .who{color:var(--dim);font-weight:400;font-style:italic}
.line.flash{animation:flash 2s 1}@keyframes flash{0%{background:#ff3ea544}100%{background:transparent}}
.mblock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;padding:8px 12px;border-radius:10px;border:1px dashed #33405a;
  background:repeating-linear-gradient(135deg,#0b111d,#0b111d 8px,#0d1422 8px,#0d1422 16px);color:#9aa8bf;font:13px var(--mono)}
.mblock b{color:#c9d3e3;font-weight:700}.mblock .sp{flex:1}.mblock button{min-height:34px;font-size:12px}
.mblock button.hot{font-size:13px;letter-spacing:.06em;padding:6px 14px}
.mblock button.mshow{min-height:0;padding:2px 6px;font-size:11px;background:none;border-color:transparent;color:var(--dim);box-shadow:none}
.mblock button.mshow:hover{color:var(--fg);border-color:#33405a}
.line.media .who{color:var(--dim)!important;font-style:italic;cursor:default}
.mlines{border-left:2px dashed #33405a;margin-left:10px;padding-left:4px}
.line.media .tx{color:#7f8ba0}.line .mx{cursor:pointer;color:var(--dim);border:0;background:none;padding:0;min-height:0;opacity:0;box-shadow:none}
.line:hover .mx{opacity:1}
.daybar{margin:14px 0 4px;color:var(--teal);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
dialog .opts{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:45vh;overflow:auto}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog .opts button{display:flex;align-items:center;gap:10px;text-align:left;min-height:44px}
dialog .opts button i{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
dialog .opts button small{color:var(--dim);margin-left:auto}
dialog .opts button.hide{display:none}
dialog .ctx{color:var(--dim);font-size:13px;margin:-4px 0 8px}
dialog .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;min-height:0;cursor:pointer}
.sw.on{border-color:#fff}
#review{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(680px,calc(100vw - 20px));background:#081624;border:1px solid var(--teal);border-radius:14px;box-shadow:0 10px 40px #000a,var(--glow);z-index:70;display:none;max-height:70vh;overflow:auto}
#review.on{display:block}
#review .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
#review .hd b{flex:1;min-width:160px}
#review .ls{border-top:1px solid var(--line);padding:6px 12px 10px}
#review .it{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #16233a;font-size:14px}
#review .it .t{color:var(--dim)}#review .it em{color:var(--dim);font-style:normal;font-size:12px}
#review .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin:8px 0 2px}
#askres .cite{display:block;color:var(--dim);font-size:13px;margin:4px 0;cursor:pointer;font-family:var(--sans)}#askres .cite:hover{color:var(--fg)}
#askres .ans{white-space:pre-wrap;margin:8px 0;font-family:var(--sans)}
@media(max-width:820px){
  .line{grid-template-columns:64px 1fr 40px 40px;row-gap:0;padding:8px 6px}.line .tx{grid-column:1/5;grid-row:2;font-size:15px}.line .x{grid-column:3;grid-row:1;opacity:1}.line .mx{grid-column:4;grid-row:1;opacity:1}
  dialog{width:calc(100vw - 16px);max-width:none;margin:auto}
  .dayhead .title{font-size:18px;width:100%}
  .dayhead select{flex:1;max-width:none}.dayhead input[type=search]{order:5;max-width:none;width:100%}
  .tools{order:6;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tools>*{flex:none}
  #info{display:none}
  #rangebar .rng{display:none}
  #heatcv{height:84px}
}
</style>
</head>
<body data-page="today">
<main class="page">
  <div class="dayhead">
    <span class="title glitch" id="daytitle">TODAY</span>
    <button id="prev" title="Previous day" aria-label="Previous day">&#9664;</button>
    <select id="daysel" aria-label="Day"></select>
    <button id="next" title="Next day" aria-label="Next day">&#9654;</button>
    <button id="today">Today</button>
    <input id="q" type="search" placeholder="Search everything (Enter)…" aria-label="Search">
    <div class="tools">
      <button id="askb" title="Ask your transcript">Ask</button>
      <button id="hist" title="Speaker changes, with undo">History</button>
      <label class="chk"><input id="noise" type="checkbox"> noise</label>
      <label class="chk"><input id="follow" type="checkbox" checked> follow</label>
      <span id="info"></span>
    </div>
  </div>
  <section class="card heat" aria-label="Timeline of who talked when">
    <canvas id="heatcv" tabindex="0" aria-label="Talk timeline. Arrow keys move between spikes, Enter jumps."></canvas>
    <div id="pres" aria-label="Who was in the room"></div>
    <div id="heatinfo"></div>
  </section>
  <div class="grid2">
    <section class="card" id="daysum"><span class="nosum">No recap for this day yet. The nightly pass writes it at 03:30.</span></section>
    <section class="card"><h2>On this day</h2><div id="otd"></div></section>
  </div>
  <section class="card" id="convs" hidden><h2>Conversations</h2><div id="convlist"></div></section>
  <div id="speakers"></div>
  <div id="rangebar">
    <span class="lbl rng">Range</span>
    <input class="rng" id="rs" type="datetime-local" step="1" aria-label="range start">
    <span class="lbl rng">to</span>
    <input class="rng" id="re" type="datetime-local" step="1" aria-label="range end">
    <button class="rng" id="rgo">Show</button>
    <button class="rng" id="rclear">Clear</button>
    <span class="spacer"></span>
    <span id="selcount">0 selected</span>
    <button id="selall">All</button>
    <button id="reassign" title="Reassign the selected lines to one person">Reassign</button>
    <button id="mkidea" title="Turn the selected lines into an idea and build its storyboard">Make idea</button>
  <button id="mkmedia" title="That was the TV / music / a movie (hides them and teaches the classifier)">&#128250; Media</button>
  <button id="mktalk" title="Not media: show these lines as talk again">Talk</button>
  <button id="mkx" title="Draft X posts from the selected lines (drafts only, never posted)">𝕏</button>
  <button id="mkq" title="Pull the best verbatim quotes from the selected lines (podcast prep)">❝</button>
    <button id="mdexp" title="Markdown of this day, or of the range when one is shown">.md</button>
    <button id="copy" class="primary">Copy</button>
  </div>
  <section id="lines" aria-label="Transcript"></section>
</main>
<dialog id="dlg"></dialog>
<div id="review" role="status" aria-live="polite"></div>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script>
const $=s=>document.querySelector(s);
const S={mode:'day',day:null,today:null,lines:[],sel:new Set(),anchor:null,rev:null,speakers:[],days:[],lastId:0,drag:false};
let PALETTE=[];
const spById=id=>S.speakers.find(s=>s.id===id);
const colorOf=id=>{const s=spById(id);return s?s.color:'#8b97ad'};
const hasNames=()=>S.speakers.some(s=>s.named);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error((await r.text())||r.status);return r.json()};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let toastT;
function toast(m,act){const t=$('#toast');t.textContent=m;t.style.pointerEvents=act?'auto':'';
  if(act){const b=el('button',null,act.label);b.style.cssText='margin-left:10px;min-height:0;padding:1px 10px;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:6px';
    b.onclick=()=>{t.classList.remove('on');act.fn()};t.append(b)}
  t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),act?10000:1800)}
const selTalk=()=>S.lines.filter(l=>S.sel.has(l.id)&&!l.media);   // copy, ideas, quotes, X, relabel: never the hidden TV lines
const lineText=(l,withDate)=>`[${withDate?l.day+' ':''}${l.t}] ${l.speaker}: ${l.text}`;

function render(keepScroll){
  const box=$('#lines');box.textContent='';
  if(!S.lines.length){const d=document.createElement('div');d.className='empty';d.textContent=S.mode==='day'?'No speech yet for this day.':'Nothing found.';box.append(d)}
  let lastDay=null,blk=null;
  S.lines.forEach((l,i)=>{
    if(S.mode!=='day'&&l.day!==lastDay){lastDay=l.day;blk=null;const h=document.createElement('div');h.className='daybar';h.textContent=l.day;box.append(h)}
    if(l.media&&S.mode!=='search'){
      // TV / music / a movie: one 'Media skipped' row, no text, no speaker (kept, never deleted); NOT MEDIA brings it back
      if(!blk||l.ts-blk.end>=600){blk={ids:[],start:l.ts,end:l.ts+l.dur};blk.el=mediaBlock(blk);box.append(blk.el.head,blk.el.body)}
      blk.ids.push(l.id);blk.end=l.ts+l.dur;blk.el.update();blk.el.body.append(lineEl(l,i));return}
    if(blk&&!l.noise)blk=null;
    box.append(lineEl(l,i));
  });
  updateSel();
}
function playLine(id,btn){return R.play(id,btn)}
function editText(l){
  const w=el('div');w.append(el('h3',null,'Fix the words'),el('div','ctx','['+l.t+'] '+l.speaker));
  const ta=document.createElement('textarea');ta.value=l.text;ta.rows=3;ta.style.width='100%';ta.setAttribute('aria-label','Line text');w.append(ta);
  w.append(el('div','ctx','The original stays saved. Changed words teach Ramblr your vocabulary for new lines.'));
  const bt=el('div','btns');const cx=el('button',null,'Cancel');const ok=el('button','primary','Save');bt.append(cx,ok);w.append(bt);
  const d=dlgOpen(w);ta.focus();cx.onclick=()=>d.close();
  const save=async()=>{try{const r=await post(`/api/segments/${l.id}/text`,{text:ta.value});d.close();
    toast(r.learned&&r.learned.length?'Saved · learned: '+r.learned.map(p=>p[0]+' → '+p[1]).join(', '):'Saved');await reload(true)}catch(e){toast('Failed: '+e.message)}};
  ok.onclick=save;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))save()};
}
function hm(ts){return new Date(ts*1000).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function mediaBlock(b){
  const head=el('div','mblock');const body=el('div','mlines');body.hidden=true;
  const txt=el('span');const sp=el('span','sp');const talk=el('button','hot','NOT MEDIA');const show=el('button','mshow','show');
  talk.title='These were people in the room, not the TV: show them as talk and label the speakers (Undo in the message)';
  talk.onclick=()=>notMedia(b.ids);
  show.title='Peek at the hidden text (kept, never deleted)';
  show.onclick=()=>{body.hidden=!body.hidden;show.textContent=body.hidden?'show':'hide'};
  head.append(txt,sp,talk,show);
  return {head,body,update(){const lab=(S.mlabels||{})[b.ids[0]]||'Media';const ttl=(S.mtitles||{})[b.ids[0]];
    head.title=(lab==='Music'?'Music':lab==='TV'?'TV':'Media')+(ttl?': '+ttl:'')+' · hidden and kept, no speaker labels';
    txt.textContent='';txt.append(el('b',null,'Media skipped'),` ${hm(b.start)} to ${hm(b.end)} · ${b.ids.length} line${b.ids.length===1?'':'s'}`)}};
}
async function notMedia(ids){
  try{const r=await post('/api/segments/media',{segment_ids:ids,media:false});
    toast(`${r.lines} line${r.lines===1?'':'s'} back to talk · ${r.labelled} labelled${r.named?` (${r.named} named)`:''}`+(r.retagged.length?` · ${r.retagged.length} more re-decided today`:''),
      {label:'Undo',fn:async()=>{try{const u=await post('/api/media/notmedia/undo',{batch:r.undo});toast(`Undone · ${u.restored} line${u.restored===1?'':'s'} put back`);await reload(true)}catch(e){toast('Undo failed: '+e.message)}}});
    S.sel.clear();await reload(true)}catch(e){toast('Failed: '+e.message)}
}
async function setMedia(ids,isMedia){
  if(!isMedia)return notMedia(ids);
  try{const r=await post('/api/segments/media',{segment_ids:ids,media:isMedia});
    const more=(r.spread||[]).length;
    toast((isMedia?`Marked ${r.lines} line${r.lines===1?'':'s'} as media`:`${r.lines} line${r.lines===1?'':'s'} back to talk`)+(more?` · marked ${more} more as TV`:'')+(r.retagged.length?` · ${r.retagged.length} more re-decided today`:''),
      more?{label:'Undo',fn:async()=>{try{const u=await post('/api/media/spread/undo',{batch:r.batch});toast(`${u.restored} line${u.restored===1?'':'s'} put back`);await reload(true)}catch(e){toast('Undo failed: '+e.message)}}}:null);
    S.sel.clear();await reload(true)}catch(e){toast('Failed: '+e.message)}
}
function lineEl(l,i){
  const d=document.createElement('div');d.className='line'+(l.noise?' noise':'')+(l.pending?' pending':'')+(S.sel.has(l.id)?' sel':'');d.dataset.id=l.id;d.dataset.i=i;
  const t=document.createElement('span');t.className='t';t.textContent=l.t;t.title=l.day+' · '+l.dur+'s · click to select, drag to select a range';
  t.onmouseenter=()=>{const c=ctxFor(l.ts);if(c)t.title=l.day+' · '+l.dur+'s\n'+c};
  const w=document.createElement('button');w.className='who'+(l.speaker_named?'':' anon');w.style.color=l.color||'#8b97ad';w.textContent=l.pending?(l.provisional?l.provisional+'?':'…'):l.speaker;
  w.title=l.pending?'Provisional: voice id still running':(hasNames()?'Who said this? Pick a person':'Click to name this voice everywhere');
  w.onclick=e=>{e.stopPropagation();if(hasNames()||l.speaker_id==null)pickerDlg({line:l});else renameDlg(l.speaker_id,l.speaker)};
  if(l.media){w.textContent='media';w.title='Media lines get no speaker. NOT MEDIA (or 🗣) makes it talk and labels it';w.onclick=e=>e.stopPropagation()}
  const x=document.createElement('span');x.className='tx';x.textContent=l.text;
  const f=document.createElement('button');f.className='x';f.textContent='⇄';f.title='Pick who said this line';f.setAttribute('aria-label','Pick who said this line');f.onclick=e=>{e.stopPropagation();pickerDlg({line:l})};
  d.id='seg-'+l.id;
  if(l.source){const mic=l.source.startsWith('mic:');const ph=el('span','moon',mic?'🎙':{iPhone:'📱',Zoom:'Z',Wispr:'W'}[l.source]||'⇪');ph.title=mic?'From the '+l.source.slice(4)+' mic':'From '+l.source;t.append(ph)}
  if(l.quiet){const m=el('span','moon','☾');m.title='Said during quiet hours (flag only)';t.append(m)}
  if(l.edited){const ed=el('span','moon','✎');ed.title='Text fixed by hand (the original is kept)';t.append(ed)}
  if(l.playable){const pb=document.createElement('button');pb.className='pl';pb.textContent='▶';pb.title='Play this line (audio is kept 24 h)';pb.setAttribute('aria-label','Play this line');
    pb.onclick=e=>{e.stopPropagation();playLine(l.id,pb)};t.append(pb)}
  x.ondblclick=e=>{e.stopPropagation();editText(l)};x.title='Double-click to fix the words';
  const mx=document.createElement('button');mx.className='mx';mx.textContent=l.media?'🗣':'📺';
  mx.title=l.media?'Not media: this was someone in the room':'That was the TV / music / a movie';mx.setAttribute('aria-label',mx.title);

function startSel(i,e){

// ---- glowing timeline heatmap: one column per 5 minutes, height by talk time, colour by who talked most ----
const H={data:null,cv:null,sel:null,drag:null};
async function loadHeat(){[H.data,H.pres]=await Promise.all([api('/api/timeline?day='+S.day+'&bin=300'),api('/api/presence?day='+S.day).catch(()=>null)]);drawHeat()}
function drawPres(){
  const box=$('#pres');if(!box)return;box.textContent='';if(!H.pres||!H.data||!H.view)return;
  const [a,z]=H.view,v0=H.data.start+a*H.data.bin,v1=H.data.start+(z+1)*H.data.bin,pct=t=>Math.max(0,Math.min(100,(t-v0)/(v1-v0)*100));
  H.pres.people.forEach(p=>{const row=el('div','plane');const n=el('span','pn',p.name);n.style.color=p.color;
    n.title=`${p.name}: in the room ${R.fmtDur(p.present_secs)}, talked ${R.fmtDur(p.talk)}`;const tr=el('div','pt');
    H.pres.quiet.forEach(q=>{const b=el('b');b.style.left=pct(q[0])+'%';b.style.width=(pct(q[1])-pct(q[0]))+'%';tr.append(b)});
    p.spans.forEach(sp=>{const i=el('i');i.style.left=pct(sp[0])+'%';i.style.width=Math.max(.4,pct(sp[1])-pct(sp[0]))+'%';i.style.background=p.color;i.style.color=p.color;
      i.title=`${p.name} ${new Date(sp[0]*1000).toTimeString().slice(0,5)} to ${new Date(sp[1]*1000).toTimeString().slice(0,5)}`;tr.append(i)});
    row.append(n,tr);box.append(row)});
  if(H.pres.people.length){const q=H.pres.quiet_cfg;const lg=el('div','dim');lg.style.fontSize='10px';
    lg.textContent=`in the room = heard within ${Math.round(H.pres.pad/60)} min, staying while silences are under ${Math.round(H.pres.merge/60)} min · TV voices excluded`+(q.enabled?` · striped = quiet hours ${q.start} to ${q.end} (flag only)`:'');box.append(lg)}
}
function bumpHeat(l){if(!H.data||S.mode!=='day'||l.day!==S.day||l.noise)return;const i=Math.floor((l.ts-H.data.start)/H.data.bin);const b=H.data.bins[i];if(!b)return;
  b.secs+=l.dur;const k=String(l.speaker_id||0);b.by[k]=(b.by[k]||0)+l.dur;if(b.first_id==null)b.first_id=l.id;H.data.max=Math.max(H.data.max,b.secs);drawHeat()}
function spColor(k){if(k==='0')return '#8b97ad';const s=spById(+k);return s?s.color:'#8b97ad'}
function heatRange(){const bins=H.data.bins;let a=bins.findIndex(b=>b.secs>0),z=bins.length-1-[...bins].reverse().findIndex(b=>b.secs>0);
  if(a<0){a=Math.max(0,new Date().getHours()*12-12);z=Math.min(bins.length-1,a+24)}
  const narrow=innerWidth<820;const pad=narrow?3:6;a=Math.max(0,a-pad);z=Math.min(bins.length-1,z+pad);
  if(!narrow){a=0;z=bins.length-1}
  return [a,z]}
function drawHeat(){
  const cv=$('#heatcv');if(!cv||!H.data)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;cv.width=W*dpr;cv.height=Ht*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,W,Ht);
  const [a,z]=heatRange();H.view=[a,z];const n=z-a+1,cw=W/n,base=Ht-18,top=12,mx=Math.max(H.data.max,30);
  g.strokeStyle='#17233a';g.lineWidth=1;g.beginPath();g.moveTo(0,base+.5);g.lineTo(W,base+.5);g.stroke();
  g.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');g.fillStyle='#7487a3';g.textAlign='center';
  for(let i=a;i<=z;i++){if(i%12===0){const x=(i-a)*cw;g.fillStyle='#17233a';g.fillRect(x,top,1,base-top);g.fillStyle='#7487a3';g.fillText(String(i/12).padStart(2,'0'),x+cw*6>W?x:x+2,Ht-4)}}
  if(H.sel){const [s,e]=H.sel[0]<=H.sel[1]?H.sel:[H.sel[1],H.sel[0]];g.fillStyle='#ff3ea522';g.fillRect((s-a)*cw,top-8,(e-s+1)*cw,base-top+8);g.strokeStyle='#ff3ea5';g.strokeRect((s-a)*cw+.5,top-7.5,(e-s+1)*cw-1,base-top+7)}
  (H.data.calendar||[]).forEach(ev=>{const i0=Math.max(a,Math.floor((ev.start-H.data.start)/H.data.bin)),i1=Math.min(z,Math.floor((ev.end-H.data.start)/H.data.bin));if(i1<a||i0>z)return;
    g.fillStyle='#2de2e614';g.fillRect((i0-a)*cw,top,(i1-i0+1)*cw,base-top);g.fillStyle='#2de2e6aa';g.fillRect((i0-a)*cw,base-3,(i1-i0+1)*cw,3);
    g.fillStyle='#7fe9f0';g.fillText((ev.title||'').slice(0,Math.max(4,Math.floor((i1-i0+1)*cw/7))),(i0-a)*cw+((i1-i0+1)*cw)/2,top+22)});
  (H.data.media||[]).forEach(m=>{const i0=Math.max(a,Math.floor((m.t0-H.data.start)/H.data.bin)),i1=Math.min(z,Math.floor((m.t1-H.data.start)/H.data.bin));if(i1<a||i0>z)return;
    g.fillStyle=m.kind==='music'?'#8b97ad22':'#8b97ad30';g.fillRect((i0-a)*cw,top,(i1-i0+1)*cw,base-top)});
  for(let i=a;i<=z;i++){const b=H.data.bins[i];if(!b.secs)continue;
    const h=Math.max(3,(base-top)*Math.sqrt(b.secs/mx));const x=(i-a)*cw;
    const top3=Object.entries(b.by).sort((p,q)=>q[1]-p[1]);let y=base;
    top3.forEach(([k,v])=>{const hh=h*v/b.secs;g.fillStyle=spColor(k);g.shadowColor=spColor(k);g.shadowBlur=10;g.fillRect(x+cw*.12,y-hh,Math.max(1,cw*.76),hh);y-=hh});
    g.shadowBlur=0}
  const glyph={idea:['✦','#2de2e6'],action:['✓','#7ff9bc'],conv:['◆','#ff3ea5']};
  (H.data.marks||[]).forEach(m=>{if(!glyph[m.kind])return;const i=Math.floor((m.ts-H.data.start)/H.data.bin);if(i<a||i>z)return;const[c,col]=glyph[m.kind];g.fillStyle=col;g.fillText(c,(i-a)*cw+cw/2,10)});
  if(H.pres)(H.pres.quiet||[]).forEach(q=>{const i0=Math.max(a,Math.floor((q[0]-H.data.start)/H.data.bin)),i1=Math.min(z,Math.ceil((q[1]-H.data.start)/H.data.bin)-1);
    if(i1>=i0){g.fillStyle='#9aa8ff10';g.fillRect((i0-a)*cw,top,(i1-i0+1)*cw,base-top);g.fillStyle='#9aa8ff88';g.fillText('☾',(i0-a)*cw+8,top+10)}});
  drawPres();
  const tot=H.data.bins.reduce((s,b)=>s+b.secs,0);$('#heatinfo').textContent=tot?`${R.fmtDur(tot)} of talk · drag to select a range, tap a spike to jump`:'No talk yet today. The bar lights up as people speak.';
}
function binAt(e){const cv=$('#heatcv'),r=cv.getBoundingClientRect(),[a,z]=H.view;return Math.max(a,Math.min(z,a+Math.floor((e.clientX-r.left)/(r.width/(z-a+1)))))}
function initHeat(){
  const cv=$('#heatcv');
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const i=binAt(e);H.drag={start:i,moved:false};H.sel=[i,i];drawHeat()});
  cv.addEventListener('pointermove',e=>{const i=binAt(e);const b=H.data&&H.data.bins[i];
    if(b){const t=new Date(b.t0*1000);const who=Object.entries(b.by).sort((p,q)=>q[1]-p[1]).map(([k,v])=>(k==='0'?'?':(spById(+k)||{}).name||'?')+' '+Math.round(v)+'s').join(', ');
      cv.title=`${t.toTimeString().slice(0,5)}  ${b.secs?who:'quiet'}`}
    if(!H.drag)return;if(i!==H.drag.start)H.drag.moved=true;H.sel=[H.drag.start,i];drawHeat()});
  cv.addEventListener('pointerup',e=>{if(!H.drag)return;const d=H.drag;H.drag=null;
    if(!d.moved){H.sel=null;drawHeat();let i=binAt(e);const bins=H.data.bins;let j=i;while(j<bins.length&&!bins[j].first_id)j++;if(j<bins.length&&bins[j].first_id){jump(bins[j].first_id)}return}
    const [s,e2]=H.sel[0]<=H.sel[1]?H.sel:[H.sel[1],H.sel[0]];const t0=H.data.start+s*H.data.bin,t1=H.data.start+(e2+1)*H.data.bin;
    S.sel=new Set(S.lines.filter(l=>l.ts>=t0&&l.ts<t1).map(l=>l.id));updateSel();
    const f=S.lines.find(l=>S.sel.has(l.id));if(f)jump(f.id);
    toast(S.sel.size?`${S.sel.size} lines selected (${new Date(t0*1000).toTimeString().slice(0,5)} to ${new Date(t1*1000).toTimeString().slice(0,5)}). Copy is in the bar.`:'No speech in that range');});
  cv.addEventListener('keydown',e=>{if(!H.data)return;const bins=H.data.bins;const cur=H.kb??bins.findIndex(b=>b.secs>0);let i=cur;
    if(e.key==='ArrowRight'){i=bins.findIndex((b,k)=>k>cur&&b.secs>0)}else if(e.key==='ArrowLeft'){for(let k=cur-1;k>=0;k--)if(bins[k].secs>0){i=k;break}}else if(e.key==='Enter'&&bins[cur]&&bins[cur].first_id){jump(bins[cur].first_id);return}else return;
    e.preventDefault();if(i>=0){H.kb=i;H.sel=[i,i];drawHeat();const t=new Date(bins[i].t0*1000);toast(t.toTimeString().slice(0,5)+' · Enter jumps there')}});
  new ResizeObserver(drawHeat).observe(cv);
}
