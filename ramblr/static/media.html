<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr media</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mh .title{font-size:24px;font-weight:800;letter-spacing:.08em;color:#eaffff;margin-right:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:12px;align-items:start}
.day{margin:14px 0 6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.mi{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:6px 0}
.mi .ic{font-size:20px;text-align:center}
.mi .tt{font-family:var(--sans);font-size:15px}.mi .tt small{display:block;color:var(--dim);font:12px var(--mono);margin-top:2px}
.mi .r{text-align:right;color:var(--dim);font-size:12px}
.mi.music .ic{color:var(--mag)}.mi.tv .ic{color:var(--teal)}.mi.play .ic{color:var(--mint)}.mi.track .ic{color:var(--amber)}
.live{color:var(--mint);font-weight:700}
.src{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid #111b2c;font-size:13px}
.src small{grid-column:1/3;color:var(--dim);font-family:var(--sans)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.mh .title{font-size:19px;width:100%}}
</style>
</head>
<body data-page="media">
<main class="page">
  <div class="mh"><span class="title glitch">MEDIA LOG</span>
    <select id="range" aria-label="Range"><option value="1">Today</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option></select></div>
  <div class="grid">
    <section id="log" aria-label="What played"></section>
    <aside class="card"><h2>Sources</h2><div id="srcs"></div><h2 style="margin-top:14px">Music ID</h2><div id="mid" class="dim"></div></aside>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,el,api}=R;
const ICON={music:'♪',tv:'📺',play:'▶',track:'♫'};
async function load(){
  const r=await api('/api/media/log?days='+$('#range').value);const box=$('#log');box.textContent='';
  if(!r.items.length)box.append(el('div','empty','Nothing played yet in this range. TV and music the room hears show up here, plus what players on gus report.'));
  let last=null;
  r.items.forEach(x=>{if(x.day!==last){last=x.day;box.append(el('div','day',new Date(x.day+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})))}
    const it=el('a','mi '+x.kind);it.href=`/?day=${x.day}`;it.style.textDecoration='none';it.style.color='inherit';
    const tt=el('div','tt');
    let main=x.title||(x.kind==='track'?'Song (not identified yet)':'');if(x.artist)main+=' — '+x.artist;
    tt.append(document.createTextNode(main));
    const sub=x.kind==='play'?`${x.src}${x.album?' · '+x.album:''}`:x.kind==='track'?`fingerprint · ${x.status}`:`heard in the room${x.lines?` · ${x.lines} line${x.lines===1?'':'s'} folded`:''}`;
    tt.append(el('small',null,sub));
    const rt=el('div','r');rt.append(document.createTextNode(x.t));rt.append(el('div',x.live?'live':'',x.live?'playing now':`${x.mins} min`));
    it.append(el('span','ic',ICON[x.kind]||'•'),tt,rt);box.append(it)});
  const s=$('#srcs');s.textContent='';
  r.sources.forEach(x=>{const d=el('div','src');d.append(el('span',null,x.name),el('span',x.configured?'chip ok':'chip warn',x.configured?'on':'stub'));if(x.needs)d.append(el('small',null,'Needs: '+x.needs));s.append(d)});
  $('#mid').textContent=r.music_id;
}
$('#range').onchange=load;
R.on('media',load);
load();setInterval(load,60000);
</script>
<script src="/static/palette.js"></script>
</body>
</html>
