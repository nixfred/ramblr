<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr drafts</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dh .title{font-size:24px;font-weight:800;letter-spacing:.08em;color:#eaffff}
.warn{border:1px solid #6b5320;color:var(--amber);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.dr{display:flex;flex-direction:column;gap:6px}.dr .m{color:var(--dim);font:11px var(--mono)}.dr b{color:#fff;font-family:var(--sans)}
.dr textarea{width:100%;min-height:150px;font:14px/1.45 var(--sans)}.dr .row{display:flex;gap:6px;flex-wrap:wrap}
.dr.dismissed{opacity:.5}.dr.approved{box-shadow:inset 3px 0 0 var(--mint)}
@media(max-width:600px){.list{grid-template-columns:1fr}}
</style>
</head>
<body data-page="drafts">
<main class="page">
  <div class="dh"><span class="title glitch">DRAFTS</span>
    <select id="st" aria-label="Filter"><option value="draft">Open</option><option value="approved">Approved</option><option value="dismissed">Dismissed</option><option value="">All</option></select></div>
  <div class="warn">Ramblr only drafts. It never sends email, messages or invites, and never posts to X. "Approve" just marks a draft as one you will send yourself; Copy puts the text on your clipboard.</div>
  <div class="list" id="list"></div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,el,api,post,toast}=R;
const ICON={email:'✉',message:'💬',event:'📅',tasks:'☑',note:'✎','x-post':'𝕏'};
async function load(){
  const rs=await api('/api/drafts?status='+$('#st').value);const box=$('#list');box.textContent='';
  if(!rs.length)box.append(el('div','empty','No drafts here. They appear when a conversation with action items ends, or from "Draft follow-ups" on a card.'));
  rs.forEach(d=>{const c=el('section','card dr '+d.status);
    c.append(el('div','m',`${ICON[d.kind]||'•'} ${d.kind}${d.recipient?' · to '+d.recipient:''} · ${d.status}${d.conversation_title?' · from "'+d.conversation_title+'"':''}`));
    if(d.subject)c.append(el('b',null,d.subject));
    const ta=document.createElement('textarea');ta.value=d.body;ta.setAttribute('aria-label','Draft text');c.append(ta);
    if(d.why)c.append(el('div','m','why: '+d.why));
    const row=el('div','row');
    const save=el('button',null,'Save');save.onclick=async()=>{await post(`/api/drafts/${d.id}`,{body:ta.value});toast('Saved')};
    const copy=el('button','primary','Copy');copy.onclick=async()=>{const t=(d.subject?d.subject+'\n\n':'')+ta.value;try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}toast('Copied: send it yourself')};
    const ap=el('button',null,d.status==='approved'?'Approved ✓':'Approve');ap.title='Mark as one you will send yourself (Ramblr sends nothing)';ap.onclick=async()=>{await post(`/api/drafts/${d.id}`,{body:ta.value,status:'approved'});load()};
    const dm=el('button',null,d.status==='dismissed'?'Restore':'Dismiss');dm.onclick=async()=>{await post(`/api/drafts/${d.id}`,{status:d.status==='dismissed'?'draft':'dismissed'});load()};
    row.append(save,copy,ap,dm);
    if(d.first_seg){const g=el('a','btn','Source');g.href=`/?day=${R.ymd(d.conversation_ts)}#seg-${d.first_seg}`;row.append(g)}
    c.append(row);box.append(c)});
}
$('#st').onchange=load;load();
</script>
<script src="/static/palette.js"></script>
</body>
</html>
