<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr people</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.wrap{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.pc{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px;background:var(--panel);width:100%}
.pc.on{border-color:var(--teal);box-shadow:var(--glow)}
.av{width:40px;height:40px;border-radius:50%;grid-row:span 2;display:flex;align-items:center;justify-content:center;font-weight:800;color:#05070d;font-size:16px;box-shadow:0 0 14px var(--c)}
.pc .nm{font-weight:800;font-size:15px}.pc .nm.anon{font-style:italic;font-weight:600}
.pc .st{font-size:12px;color:var(--dim)}
.spark{grid-column:1/3;display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:4px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.detail .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.detail .top .av{width:56px;height:56px;font-size:22px;grid-row:auto}
.detail h1{margin:0;font-size:26px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg2)}
.stat b{display:block;font-size:22px;color:#eaffff}.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:3px;height:80px;padding:6px 0;border-bottom:1px solid var(--line)}
.bars i{flex:1;border-radius:3px 3px 0 0;min-height:2px;cursor:pointer;opacity:.9}
.bars i:hover{opacity:1;filter:brightness(1.3)}
.rl{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:6px 4px;border-bottom:1px solid #111b2c;font-family:var(--sans);font-size:14px;text-decoration:none;color:var(--fg)}
.rl:hover{background:#0b1626}.rl .t{color:var(--dim);font:12px var(--mono)}
.ai{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 4px;border-bottom:1px solid #111b2c;font-family:var(--sans);font-size:14px;text-decoration:none;color:var(--fg)}
.ai small{color:var(--dim);font-family:var(--mono)}
.edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;min-height:0}
.sw.on{border-color:#fff}
.sec{margin-top:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.rl{grid-template-columns:1fr}.detail h1{font-size:21px}}
</style>
</head>
<body data-page="people">
<main class="page">
  <div class="wrap">
    <section class="list" id="list" aria-label="People"></section>
    <section class="card detail" id="detail"><div class="empty">Pick a person.</div></section>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,el,api,post,toast,fmtDur}=R;
let PEOPLE=[],cur=+(new URLSearchParams(location.search).get('id')||0),PAL=[];
const initial=n=>(n||'?').replace(/^Speaker\s*/,'#').slice(0,2).toUpperCase();
function avatar(p,cls){const a=el('div','av'+(cls?' '+cls:''),initial(p.name));a.style.background=p.color;a.style.setProperty('--c',p.color+'88');return a}
async function loadSuggestions(box){
  // "Speaker N sounds like X: same person?" one click merges (the existing rename-to-that-name merge); No is remembered
  let sg=[];try{sg=await api('/api/speakers/suggestions')}catch(e){return}
  sg.forEach(s=>{const c=el('div','card sugg');c.setAttribute('role','note');
    c.append(el('div',null,`${s.cluster} sounds like ${s.person} (${s.sim}${s.next?` vs ${s.next.person} ${s.next.sim}`:''}, ${s.lines} lines). Same person?`));
    const y=el('button','hot','Yes, merge');y.onclick=async()=>{y.disabled=true;try{await post(`/api/speakers/${s.cluster_id}/rename`,{name:s.person});toast(`Merged ${s.cluster} into ${s.person}`);await loadList()}catch(e){y.disabled=false;toast('Failed: '+e.message)}};
    const n=el('button',null,'No');n.onclick=async()=>{try{await post('/api/speakers/suggestions/dismiss',{cluster_id:s.cluster_id,person_id:s.person_id});c.remove()}catch(e){toast('Failed: '+e.message)}};
    c.append(y,n);box.append(c)});
}
async function loadList(){
  PEOPLE=await api('/api/people');const box=$('#list');box.textContent='';
  await loadSuggestions(box);
  if(!PEOPLE.length){box.append(el('div','empty','Nobody yet. Voices appear here once Ramblr hears them.'));return}
  const mx=Math.max(1,...PEOPLE.flatMap(p=>p.last14));
  PEOPLE.forEach(p=>{const b=el('button','pc'+(p.id===cur?' on':''));b.dataset.id=p.id;
    const nm=el('span','nm'+(p.named?'':' anon'),p.name+(p.confirmed?' ✓':''));nm.style.color=p.color;
    b.append(avatar(p),nm,el('span','st',`${fmtDur(p.talk_secs)} talk · ${p.lines} lines`));
    const sp=el('div','spark');sp.setAttribute('aria-hidden','true');p.last14.forEach(v=>{const i=el('i');i.style.height=Math.max(4,100*v/mx)+'%';i.style.background=v?p.color:'#17233a';sp.append(i)});b.append(sp);
    b.onclick=()=>show(p.id);box.append(b)});
  if(!cur&&PEOPLE.length)cur=PEOPLE[0].id;
  if(cur)show(cur,true);
}
async function show(id,quiet){
  cur=id;document.querySelectorAll('.pc').forEach(b=>b.classList.toggle('on',+b.dataset.id===id));
  history.replaceState(null,'','/people?id='+id);
  const p=await api('/api/people/'+id);
  if(p.merged_into){show(p.merged_into);return}
  const d=$('#detail');d.textContent='';
  const top=el('div','top');const h=el('h1',null,p.name);h.style.color=p.color;
  top.append(avatar(p),h);if(p.confirmed)top.append(el('span','chip ok','confirmed as you'));if(!p.named)top.append(el('span','chip warn','unnamed voice'));
  if((p.ambiguous_samples||[]).length){const a=el('span','chip warn',`ambiguous sample${p.ambiguous_samples.length>1?'s':''}: ${p.ambiguous_samples.length}`);
    a.title='Hand-labelled lines whose voice sounds about as much like someone else. They keep your label but count half in the voiceprint:\n'+p.ambiguous_samples.map(x=>`[${x.day} ${x.t}] ${x.text}`).join('\n');top.append(a)}
  d.append(top);
  const st=el('div','stats');
  const days=p.per_day.length;
  [[fmtDur(p.talk_secs),'talk time'],[p.lines,'lines'],[days?fmtDur(p.talk_secs/days):'0s','per active day'],[p.last_seen?new Date(p.last_seen*1000).toLocaleDateString():'never','last heard'],[p.voiceprint_samples,'voice samples']]
    .forEach(([v,k])=>{const s=el('div','stat');s.append(el('b',null,String(v)),el('span',null,k));st.append(s)});
  d.append(st);
  try{const pr=await api('/api/presence');const me=pr.people.find(x=>x.speaker_id===p.id);
    const line=el('div','dim');line.style.margin='-4px 0 8px';
    line.textContent=me?'In the room today: '+me.spans.map(s=>new Date(s[0]*1000).toTimeString().slice(0,5)+' to '+new Date(s[1]*1000).toTimeString().slice(0,5)).join(', ')+` (${fmtDur(me.present_secs)})`:'Not heard in the room today.';
    d.append(line)}catch(e){}
  const sec1=el('div','sec');sec1.append(el('h2',null,'Talk time by day (last 60 active days)'));
  const bars=el('div','bars');const pd=[...p.per_day].reverse();const mx=Math.max(1,...pd.map(x=>x.secs));
  pd.forEach(x=>{const i=el('i');i.style.height=Math.max(3,100*x.secs/mx)+'%';i.style.background=p.color;i.title=`${x.day}: ${fmtDur(x.secs)}, ${x.lines} lines`;i.onclick=()=>location.href='/?day='+x.day;bars.append(i)});
  if(!pd.length)bars.append(el('span','dim','no lines yet'));
  sec1.append(bars);d.append(sec1);
  // edit: rename (an existing name merges), colour, confirm
  const ed=el('div','sec');ed.append(el('h2',null,'Name, merge and colour'));
  const row=el('div','edit');const inp=el('input');inp.value=p.named?p.name:'';inp.placeholder='Name (an existing name merges the voices)';inp.setAttribute('aria-label','Name');inp.style.minWidth='240px';
  const sv=el('button','primary','Save name');
  sv.onclick=async()=>{const n=inp.value.trim();if(!n)return;try{const r=await post(`/api/speakers/${p.id}/rename`,{name:n});toast(r.merged?`Merged into ${n}: lines relabelled, voiceprints combined, nothing deleted`:'Renamed to '+n);await loadList()}catch(e){toast('Failed: '+e.message)}};
  inp.onkeydown=e=>{if(e.key==='Enter')sv.click()};
  row.append(inp,sv);
  const others=PEOPLE.filter(x=>x.id!==p.id&&x.named);
  if(others.length){const ms=el('select');ms.setAttribute('aria-label','Merge into');ms.append(Object.assign(el('option',null,'Merge this voice into…'),{value:''}));others.forEach(o=>{const op=el('option',null,o.name);op.value=o.name;ms.append(op)});
    const mb=el('button','hot','Merge');mb.onclick=async()=>{if(!ms.value)return;try{await post(`/api/speakers/${p.id}/rename`,{name:ms.value});toast(`Merged into ${ms.value}. Undo is in History on the Today page.`);cur=others.find(o=>o.name===ms.value).id;await loadList()}catch(e){toast('Failed: '+e.message)}};
    row.append(ms,mb)}
  ed.append(row);
  const cr=el('div','edit');
  if(!PAL.length)try{PAL=(await api('/api/palette')).palette}catch(e){}
  PAL.forEach(c=>{const b=el('button','sw'+(p.color===c?' on':''));b.style.background=c;b.title=c;b.setAttribute('aria-label','colour '+c);
    b.onclick=async()=>{try{await post(`/api/speakers/${p.id}/color`,{color:c});toast('Colour saved');await loadList()}catch(e){toast('Failed: '+e.message)}};cr.append(b)});
  if(!p.named)cr.append(el('span','dim','(unnamed voices stay gray until named)'));
  if(p.named&&!p.confirmed){const cf=el('button',null,'Confirm this is me');cf.onclick=async()=>{try{await post(`/api/speakers/${p.id}/confirm`,{});toast('Confirmed: '+p.name+' is you');show(p.id)}catch(e){toast('Failed: '+e.message)}};cr.append(cf)}
  ed.append(cr);d.append(ed);
  const ai=el('div','sec');ai.append(el('h2',null,`Action items they own (${p.action_items.length})`));
  if(!p.action_items.length)ai.append(el('div','dim','None yet. The nightly pass assigns owners.'));
  p.action_items.forEach(a=>{const r=el('a','ai');r.href=a.link;r.append(el('span',null,a.task+(a.specifics?' — '+a.specifics:'')),el('small',null,(a.due?'due '+a.due:'no date')+(a.sent?' · sent':'')));ai.append(r)});
  d.append(ai);
  const rl=el('div','sec');rl.append(el('h2',null,'Recent lines'));
  p.recent.forEach(l=>{const r=el('a','rl');r.href=`/?day=${l.day}#seg-${l.id}`;r.append(el('span','t',`${l.day} ${l.t}`),el('span',null,l.text));rl.append(r)});
  if(!p.recent.length)rl.append(el('div','dim','No lines yet.'));
  d.append(rl);
}
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,#kpal'))return;
  const i=PEOPLE.findIndex(p=>p.id===cur);if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();if(PEOPLE[i+1])show(PEOPLE[i+1].id)}if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();if(PEOPLE[i-1])show(PEOPLE[i-1].id)}});
window.ramblrCommands=window.ramblrCommands||[];
R.on('reload',loadList);
loadList().then(()=>PEOPLE.forEach(p=>window.ramblrCommands.push({id:'person-'+p.id,title:'Person: '+p.name,hint:fmtDur(p.talk_secs),run:()=>show(p.id)})));
</script>
<script src="/static/palette.js"></script>
</body>
</html>
