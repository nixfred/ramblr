<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramblr search</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/brand/nixfred-icon.svg">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/static/theme.css">
<style>
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbar input[type=search]{flex:1;min-width:220px;font-size:17px;padding:10px 14px}
.modes{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.modes button{border:0;border-radius:0;min-height:42px}
.modes button.on{background:#062a30;color:var(--teal);box-shadow:inset 0 -2px 0 var(--teal)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filters label{color:var(--dim);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.kind{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line2);border-radius:99px;font-size:12px;cursor:pointer;min-height:36px}
.kind input{margin:0}
.results{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.grp h2 small{color:var(--dim);font-weight:400;letter-spacing:.04em}
.hit{display:grid;grid-template-columns:150px 120px 1fr;gap:10px;padding:8px 6px;border-bottom:1px solid #111b2c;text-decoration:none;color:var(--fg);font-family:var(--sans);font-size:14px;border-radius:6px}
.hit:hover{background:#0b1626}.hit .t{color:var(--dim);font:12px var(--mono)}.hit .w{font:700 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chunk{padding:8px 6px;border-bottom:1px solid #111b2c}.chunk .sc{font:11px var(--mono);color:var(--mag)}
.chunk a{display:grid;grid-template-columns:150px 120px 1fr;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--sans);font-size:14px;padding:2px 0}
.chunk a .t{color:var(--dim);font:12px var(--mono)}
.answer{font-family:var(--sans);font-size:16px;line-height:1.55;white-space:pre-wrap}
.cite{display:block;color:var(--dim);font-size:13px;margin:4px 0;text-decoration:none;font-family:var(--sans)}.cite:hover{color:var(--fg)}
.cite b{color:var(--teal);font-family:var(--mono)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:820px){.hit,.chunk a{grid-template-columns:1fr 1fr}.hit .x,.chunk a .x{grid-column:1/3}}
</style>
</head>
<body data-page="search">
<main class="page">
  <div class="card">
    <div class="sbar">
      <input id="q" type="search" placeholder="Search words, or ask a question…" aria-label="Search" autofocus>
      <div class="modes" role="tablist" aria-label="Search mode">
        <button id="m-words" class="on" role="tab">Words</button>
        <button id="m-meaning" role="tab" title="Semantic search: embeddings on the NPU">Meaning</button>
        <button id="m-ask" role="tab" title="An answer with citations">Ask</button>
      </div>
      <button id="go" class="primary">Go</button>
    </div>
    <div class="filters">
      <label>Speaker <select id="spk"><option value="0">anyone</option></select></label>
      <label>From <input id="from" type="date"></label>
      <label>To <input id="to" type="date"></label>
      <label class="kind"><input type="checkbox" value="lines" checked> lines</label>
      <label class="kind"><input type="checkbox" value="ideas" checked> ideas</label>
      <label class="kind"><input type="checkbox" value="actions" checked> action items</label>
    </div>
  </div>
  <div class="results" id="res"></div>
</main>
<script src="/static/app.js"></script>
<script>
const {$,el,api,post,highlight,fmtDur}=R;
let mode='words',SPK=[];
const P=new URLSearchParams(location.search);
function setMode(m){mode=m;['words','meaning','ask'].forEach(x=>$('#m-'+x).classList.toggle('on',x===m));$('#q').placeholder=m==='ask'?'Ask a question, e.g. What did we decide about the deck?':m==='meaning'?'Describe it, e.g. arguments about money':'Search words…'}
['words','meaning','ask'].forEach(m=>$('#m-'+m).onclick=()=>{setMode(m);if($('#q').value.trim())run()});
function kinds(){return [...document.querySelectorAll('.kind input:checked')].map(x=>x.value).join(',')}
function lineLink(l,q){const a=el('a','hit');a.href=`/?day=${l.day}#seg-${l.id}`;const w=el('span','w',l.speaker);w.style.color=l.color;a.append(el('span','t',`${l.day} ${l.t}`),w,highlight(el('span','x'),l.text,q));return a}
function grp(title,n){const g=el('section','card grp');const h=el('h2',null,title+' ');h.append(el('small',null,`(${n})`));g.append(h);return g}
async function run(){
  const q=$('#q').value.trim();const res=$('#res');res.textContent='';
  const sp=+$('#spk').value,from=$('#from').value,to=$('#to').value;
  history.replaceState(null,'','/search?'+new URLSearchParams({q,mode,...(sp?{speaker:sp}:{}),...(from?{from}:{}),...(to?{to}:{})}));
  if(!q&&!sp&&mode!=='words')return;
  if(mode==='ask'){
    const c=el('section','card');c.append(el('h2',null,'Answer'));const a=el('div','answer');a.innerHTML='<span class="spin"></span>Searching by meaning on the NPU, then writing the answer…';c.append(a);res.append(c);
    try{const r=await post('/api/ask',{q});a.textContent=r.answer;
      if(r.scope&&r.scope.start)c.append(el('div','dim',`searched ${new Date(r.scope.start*1000).toLocaleString()} to ${new Date(r.scope.end*1000).toLocaleString()}`));
      if(r.citations.length){c.append(el('h2',null,'Sources'));r.citations.forEach(x=>{const l=el('a','cite');l.href=`/?day=${x.day}#seg-${x.id}`;if(x.playable)l.append(R.playButton(x.id));l.append(el('b',null,`#${x.id} ${x.day} ${x.t} `),document.createTextNode(x.speaker+': '+x.text));c.append(l)})}
      c.append(el('div','dim',`${r.model||''} · ${r.seconds||''}s · ${r.retrieved||0} lines retrieved`))}catch(e){a.textContent='Failed: '+e.message}
    return}
  if(mode==='meaning'){
    const g=grp('By meaning','…');res.append(g);
    try{const p=new URLSearchParams({q,k:'20'});if(sp)p.set('speaker_id',sp);if(from)p.set('start',from+' 00:00');if(to)p.set('end',to+' 23:59');
      const r=await api('/api/search/semantic?'+p);g.querySelector('small').textContent=`(${r.hits.length})`;
      if(!r.hits.length)g.append(el('div','dim','Nothing indexed matches yet (lines are indexed a few minutes after they are spoken).'));
      r.hits.forEach(h=>{const c=el('div','chunk');c.append(el('div','sc',`match ${h.score.toFixed(2)}`));h.lines.forEach(l=>{const a=el('a');a.href=`/?day=${l.day}#seg-${l.id}`;const w=el('span','w',l.speaker);w.style.color=l.color;a.append(el('span','t',`${l.day} ${l.t}`),w,el('span','x',l.text));c.append(a)});g.append(c)})}
    catch(e){g.append(el('div','dim','Failed: '+e.message))}
    return}
  const p=new URLSearchParams({q,kinds:kinds()});if(sp)p.set('speaker_id',sp);if(from)p.set('start',from);if(to)p.set('end',to);
  const r=await api('/api/search?'+p);let any=false;
  if(r.lines.length){any=true;const g=grp('Lines',r.lines.length);r.lines.forEach(l=>g.append(lineLink(l,q)));res.append(g)}
  if(r.ideas.length){any=true;const g=grp('Ideas',r.ideas.length);r.ideas.forEach(i=>{const a=el('a','hit');a.href='/ideas';a.append(el('span','t',new Date(i.created*1000).toLocaleDateString()),el('span','w',i.status),highlight(el('span','x'),i.title,q));g.append(a)});res.append(g)}
  if(r.actions.length){any=true;const g=grp('Action items',r.actions.length);r.actions.forEach(x=>{const a=el('a','hit');a.href=x.link;a.append(el('span','t',x.day+(x.due?' → '+x.due:'')),el('span','w',x.owner||'?'),highlight(el('span','x'),x.task+(x.specifics?' — '+x.specifics:''),q));g.append(a)});res.append(g)}
  if(!any)res.append(el('div','empty',q||sp?'No word matches. Try Meaning for a fuzzy match, or Ask for an answer.':'Type something to search.'));
}
$('#go').onclick=run;$('#q').onkeydown=e=>{if(e.key==='Enter')run()};
['#spk','#from','#to'].forEach(s=>$(s).onchange=()=>{if($('#q').value.trim()||+$('#spk').value)run()});
document.querySelectorAll('.kind input').forEach(x=>x.onchange=()=>{if(mode==='words')run()});
(async()=>{SPK=await api('/api/speakers');SPK.forEach(s=>{const o=el('option',null,s.name);o.value=s.id;$('#spk').append(o)});
  if(P.get('ask'))setMode('ask');if(P.get('mode'))setMode(P.get('mode'));if(P.get('speaker'))$('#spk').value=P.get('speaker');
  if(P.get('from'))$('#from').value=P.get('from');if(P.get('to'))$('#to').value=P.get('to');
  if(P.get('q')){$('#q').value=P.get('q');run()}})();
window.ramblrCommands=window.ramblrCommands||[];
window.ramblrCommands.push({id:'mode-words',title:'Search mode: words',run:()=>setMode('words')},{id:'mode-meaning',title:'Search mode: meaning (NPU)',run:()=>setMode('meaning')},{id:'mode-ask',title:'Search mode: ask',run:()=>setMode('ask')});
</script>
<script src="/static/palette.js"></script>
</body>
</html>
